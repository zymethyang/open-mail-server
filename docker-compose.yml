services:
  open-mail-server:
    image: zymethyang/open-mail-server:v1.4.0
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/opt/open-mail-server/data
