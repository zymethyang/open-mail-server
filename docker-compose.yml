services:
  email-server:
    build: .
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "3000:3000"
    volumes:
      - ./data:/opt/email-server/data
